name: Build Skyrim Scripts

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

env:
  PROJECT_NAME: LumaUtil

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Archive
        run: 7z a ${{ env.PROJECT_NAME }}-Scripts.zip ./scripts/**
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Skyrim"
          path: |
            ./res/Data/**
      - name: Create & Upload Release
        id: upload-release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_NAME }}-Scripts.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.PROJECT_NAME }} ${{ github.ref_name }}
        if: github.ref_type == 'tag'
